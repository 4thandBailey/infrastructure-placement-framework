<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="960" height="760"
     viewBox="0 0 960 760"
     role="img"
     aria-labelledby="svg-title svg-desc"
     font-family="'Segoe UI', Arial, sans-serif">

  <title id="svg-title">AiTM Phishing Attack — Mind Map</title>
  <desc id="svg-desc">Three-branch mind map of the AiTM phishing attack pattern, defensive controls, and post-compromise remediation. Left branch: credential spray, PowerShell probing, AiTM breach, persistence. Right branch: FIDO2 MFA, Token Protection, Safe Links/Attachments, Identity Protection. Bottom: five-step remediation sequence. Infrastructure Placement Framework Module 04, by 4th and Bailey. All data anonymized.</desc>

  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="960" height="760" fill="#F2F1ED"/>

  <rect x="0" y="0" width="960" height="64" fill="#0C447C"/>
  <text x="36" y="20" font-size="10" font-weight="500" fill="#7AABDA">INFRASTRUCTURE PLACEMENT FRAMEWORK — MODULE 04</text>
  <text x="36" y="46" font-size="20" font-weight="600" fill="#FFFFFF">AiTM Phishing Attack — Mind Map</text>
  <text x="924" y="46" font-size="10" fill="#7AABDA" text-anchor="end">Anonymized case study · May 2026</text>

  <rect x="340" y="82" width="280" height="56" rx="10" fill="#0C447C" stroke="#185FA5" stroke-width="1"/>
  <text x="480" y="104" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">AiTM phishing attack</text>
  <text x="480" y="124" font-size="11" fill="#B5D4F4" text-anchor="middle">adversary-in-the-middle · Microsoft 365</text>

  <path d="M 340 110 L 210 110 L 210 170" fill="none" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="110" y="170" width="200" height="48" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="210" y="189" font-size="12" font-weight="600" fill="#712B13" text-anchor="middle">Attack chain</text>
  <text x="210" y="207" font-size="10" fill="#993C1D" text-anchor="middle">3 phases + persistence</text>

  <line x1="210" y1="218" x2="210" y2="614" stroke="#E0DFD8" stroke-width="1" stroke-dasharray="3 3"/>

  <path d="M 210 254 L 130 254" fill="none" stroke="#993C1D" stroke-width="0.75" marker-end="url(#arr-red)"/>
  <rect x="22" y="232" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.75"/>
  <text x="122" y="252" font-size="11" font-weight="600" fill="#791F1F" text-anchor="middle">Phase 1 — credential spray</text>
  <text x="122" y="270" font-size="10" fill="#993C1D" text-anchor="middle">96 attempts · ASN rotation · error 50053</text>

  <path d="M 210 354 L 130 354" fill="none" stroke="#993C1D" stroke-width="0.75" marker-end="url(#arr-red)"/>
  <rect x="22" y="332" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.75"/>
  <text x="122" y="352" font-size="11" font-weight="600" fill="#791F1F" text-anchor="middle">Phase 2 — PowerShell probe</text>
  <text x="122" y="370" font-size="10" fill="#993C1D" text-anchor="middle">Directory-level access attempt</text>

  <path d="M 210 454 L 130 454" fill="none" stroke="#993C1D" stroke-width="0.75" marker-end="url(#arr-red)"/>
  <rect x="22" y="432" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.75"/>
  <text x="122" y="452" font-size="11" font-weight="600" fill="#791F1F" text-anchor="middle">Phase 3 — AiTM breach</text>
  <text x="122" y="470" font-size="10" fill="#993C1D" text-anchor="middle">Session token captured · MFA bypassed</text>

  <path d="M 210 554 L 130 554" fill="none" stroke="#993C1D" stroke-width="0.75" marker-end="url(#arr-red)"/>
  <rect x="22" y="532" width="200" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.75"/>
  <text x="122" y="552" font-size="11" font-weight="600" fill="#791F1F" text-anchor="middle">Persistence</text>
  <text x="122" y="570" font-size="10" fill="#993C1D" text-anchor="middle">Rogue MFA device + inbox rule "."</text>

  <path d="M 620 110 L 750 110 L 750 170" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="650" y="170" width="200" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="750" y="189" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">Defensive controls</text>
  <text x="750" y="207" font-size="10" fill="#0F6E56" text-anchor="middle">mapped to each phase</text>

  <line x1="750" y1="218" x2="750" y2="614" stroke="#E0DFD8" stroke-width="1" stroke-dasharray="3 3"/>

  <path d="M 750 254 L 830 254" fill="none" stroke="#0F6E56" stroke-width="0.75" marker-end="url(#arr-green)"/>
  <rect x="738" y="232" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text x="838" y="252" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">FIDO2 / phishing-resistant MFA</text>
  <text x="838" y="270" font-size="10" fill="#0F6E56" text-anchor="middle">Key refuses wrong domain · defeats P3</text>

  <path d="M 750 354 L 830 354" fill="none" stroke="#0F6E56" stroke-width="0.75" marker-end="url(#arr-green)"/>
  <rect x="738" y="332" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text x="838" y="352" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">Token Protection (CA policy)</text>
  <text x="838" y="370" font-size="10" fill="#0F6E56" text-anchor="middle">Binds token to device · blocks replay</text>

  <path d="M 750 454 L 830 454" fill="none" stroke="#0F6E56" stroke-width="0.75" marker-end="url(#arr-green)"/>
  <rect x="738" y="432" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text x="838" y="452" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">Defender Safe Links / Attachments</text>
  <text x="838" y="470" font-size="10" fill="#0F6E56" text-anchor="middle">Intercepts delivery before click</text>

  <path d="M 750 554 L 830 554" fill="none" stroke="#0F6E56" stroke-width="0.75" marker-end="url(#arr-green)"/>
  <rect x="738" y="532" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text x="838" y="552" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">Identity Protection (risk CA)</text>
  <text x="838" y="570" font-size="10" fill="#0F6E56" text-anchor="middle">Blocks high-risk sign-ins automatically</text>

  <line x1="222" y1="260" x2="738" y2="260" stroke="#E0DFD8" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="222" y1="360" x2="738" y2="360" stroke="#E0DFD8" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="222" y1="460" x2="738" y2="460" stroke="#E0DFD8" stroke-width="0.75" stroke-dasharray="4 4"/>
  <line x1="222" y1="560" x2="738" y2="560" stroke="#E0DFD8" stroke-width="0.75" stroke-dasharray="4 4"/>

  <line x1="480" y1="138" x2="480" y2="178" stroke="#B5D4F4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="348" y="178" width="264" height="56" rx="8" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="0.75"/>
  <text x="480" y="198" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Why standard MFA fails</text>
  <text x="480" y="216" font-size="10" fill="#5c5c5c" text-anchor="middle">Token captured via real-time proxy relay</text>

  <rect x="332" y="254" width="296" height="120" rx="8" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="0.75"/>
  <text x="480" y="274" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">What AiTM captures</text>
  <line x1="332" y1="284" x2="628" y2="284" stroke="#E0DFD8" stroke-width="0.5"/>
  <text x="348" y="302" font-size="10" fill="#5c5c5c">Password</text>
  <text x="612" y="302" font-size="10" fill="#5c5c5c" text-anchor="end">Credential reuse across services</text>
  <line x1="332" y1="314" x2="628" y2="314" stroke="#E0DFD8" stroke-width="0.5"/>
  <text x="348" y="332" font-size="10" fill="#5c5c5c">MFA approval</text>
  <text x="612" y="332" font-size="10" fill="#5c5c5c" text-anchor="end">Full authenticated session</text>
  <line x1="332" y1="344" x2="628" y2="344" stroke="#E0DFD8" stroke-width="0.5"/>
  <text x="348" y="362" font-size="10" fill="#5c5c5c">Session token (cookie)</text>
  <text x="612" y="362" font-size="10" fill="#5c5c5c" text-anchor="end">Replay without further MFA</text>

  <rect x="352" y="394" width="256" height="48" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.75"/>
  <text x="480" y="412" font-size="11" font-weight="600" fill="#633806" text-anchor="middle">Known toolkits</text>
  <text x="480" y="430" font-size="10" fill="#854F0B" text-anchor="middle">Evilginx · Modlishka · documented variants</text>

  <rect x="332" y="462" width="296" height="48" rx="8" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="0.75"/>
  <text x="480" y="480" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Key sign-in log indicator</text>
  <text x="480" y="498" font-size="10" fill="#5c5c5c" text-anchor="middle">"MFA satisfied by claim in the token"</text>

  <rect x="332" y="530" width="296" height="48" rx="8" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="0.75"/>
  <text x="480" y="548" font-size="11" font-weight="600" fill="#1a1a1a" text-anchor="middle">Inbox rule obfuscation</text>
  <text x="480" y="566" font-size="10" fill="#5c5c5c" text-anchor="middle">Rule named "." — conceals attacker activity</text>

  <path d="M 480 614 L 480 638" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="320" y="638" width="320" height="48" rx="8" fill="#0C447C" stroke="#185FA5" stroke-width="1"/>
  <text x="480" y="657" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Post-compromise remediation</text>
  <text x="480" y="675" font-size="10" fill="#B5D4F4" text-anchor="middle">execute all steps in a single session</text>

  <line x1="370" y1="686" x2="88" y2="706" stroke="#B5D4F4" stroke-width="0.75"/>
  <rect x="14" y="706" width="148" height="36" rx="18" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="88" y="724" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">1. Remove MFA devices</text>

  <line x1="415" y1="686" x2="232" y2="706" stroke="#B5D4F4" stroke-width="0.75"/>
  <rect x="158" y="706" width="148" height="36" rx="18" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="232" y="724" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">2. Reset password</text>

  <line x1="480" y1="686" x2="480" y2="706" stroke="#B5D4F4" stroke-width="0.75"/>
  <rect x="406" y="706" width="148" height="36" rx="18" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="480" y="724" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">3. Invalidate tokens</text>

  <line x1="545" y1="686" x2="728" y2="706" stroke="#B5D4F4" stroke-width="0.75"/>
  <rect x="654" y="706" width="148" height="36" rx="18" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="728" y="724" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">4. Audit mailbox</text>

  <line x1="590" y1="686" x2="872" y2="706" stroke="#B5D4F4" stroke-width="0.75"/>
  <rect x="798" y="706" width="148" height="36" rx="18" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="872" y="718" font-size="10" font-weight="600" fill="#0C447C" text-anchor="middle">5. New account</text>
  <text x="872" y="732" font-size="9" fill="#185FA5" text-anchor="middle">if deep compromise</text>

  <rect x="332" y="604" width="296" height="28" rx="6" fill="#FFFFFF" stroke="#E0DFD8" stroke-width="0.75"/>
  <rect x="344" y="613" width="10" height="10" rx="2" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.75"/>
  <text x="360" y="618" font-size="9" fill="#5c5c5c" dominant-baseline="central">Attack chain</text>
  <rect x="420" y="613" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.75"/>
  <text x="436" y="618" font-size="9" fill="#5c5c5c" dominant-baseline="central">Controls</text>
  <rect x="492" y="613" width="10" height="10" rx="2" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.75"/>
  <text x="508" y="618" font-size="9" fill="#5c5c5c" dominant-baseline="central">Remediation</text>
  <line x1="564" y1="618" x2="578" y2="618" stroke="#E0DFD8" stroke-width="0.75" stroke-dasharray="3 2"/>
  <text x="584" y="618" font-size="9" fill="#5c5c5c" dominant-baseline="central">Phase mapping</text>

  <line x1="0" y1="750" x2="960" y2="750" stroke="#E0DFD8" stroke-width="0.75"/>
  <text x="36" y="756" font-size="9" fill="#8a8a8a" dominant-baseline="central">Infrastructure Placement Framework — Module 04 · 4th and Bailey | Information Technology Consulting · Houston, TX</text>
